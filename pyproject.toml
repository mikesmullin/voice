[project]
dependencies = [
  "pyyaml>=6.0",
  "soundfile>=0.12.1",
  "sounddevice>=0.4.6",
  "pip>=25.3",
  "piper-tts>=1.4.2",
]
description = "A simple text-to-speech CLI using Kokoro with 28 English voice presets"
name = "voice"
requires-python = ">=3.10,<3.13"
version = "0.1.0"

[project.optional-dependencies]
kokoro = [
  "torch>=2.0.0",
  "kokoro>=0.9.4",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"

[tool.uv.sources]
torch = [
  {index = "pytorch-cu129", marker = "sys_platform != 'darwin'"},
]
torchaudio = [
  {index = "pytorch-cu129", marker = "sys_platform != 'darwin'"},
]

[project.scripts]
voice = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
src = ["config.yaml"]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel"]
