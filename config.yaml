# Voice Configuration File
# Supports multiple TTS engines: kokoro (GPU), piper (CPU), audio8 (CPU ONNX runtime, see src/engines/audio8.zig)

# Default fallback voice when server is unavailable
fallback_voice: lessac

# Preset used when no voice is specified (bare `voice "..."` shorthand,
# `client` with no preset, HTTP /speak with no "voice"). Takes precedence
# over fallback_voice; lessac stays as the safety net.
default_preset: ruthie

# Voice presets to warm up (load model + voice, no playback) when `voice serve`
# starts, so the *first* real `voice hot` request for these presets is as fast
# as subsequent ones instead of paying a full model/voice load on request 1.
preload:
  - bella   # main Kokoro voice
  - lessac  # main Piper voice / fallback

# Speaker/sink aliases (tmp/FUN_PLAN.md section 1) - `voice speakers` lists
# raw sink names to put here; `-d/--speaker <alias>` routes audio there
# (Linux only). Aliases are the only accepted values for -d - an unknown
# alias is a hard error, never a raw-sink-name passthrough.
speakers:
  hdmi: alsa_output.pci-0000_81_00.1.hdmi-stereo

# LM Studio's local server (tmp/FUN_PLAN.md section 4) - used for the
# personality-prompt feature (a preset's `personality_prompt`, below).
# Requires LM Studio's local server running with a model loaded; if
# unreachable, presets fall back to speaking the literal input text.
llm:
  completion_url: "http://localhost:1234/v1/chat/completions"
  # Must match the model id the local server actually reports
  # (LM Studio: `default`; llama-server exposes it as `llama-server:default`).
  model: "default"
  # Reasoning level for hybrid-reasoning models ("low"/"medium"/"high").
  reasoning_effort: "medium"

# Effect presets (tmp/FUN_PLAN.md section 2) - `-e/--effect <name>` chains
# these onto synthesized audio. See src/audio/effects.zig for what each
# step kind actually does.
effects:
  radio_comms:
    chain:
      - stinger:
          file: "sfx/alert.wav"
      - distortion:
          drive: 2.8
      - bandpass:
          low: 280
          high: 3600
      - lowpass:
          cutoff: 4800
      - delay:
          time_ms: 95
          feedback: 0.22
          wet: 0.18
    background:
      volume: 0.15
      sources:
        - file: "sfx/error.wav"

  appalachian_background:
    # Old-Time Appalachian Music for Focus & Background (~2h) - played under
    # Ruthie's vocalizations. random_start: each utterance picks a random
    # point in the track; the music is read only for the voice's duration
    # (the full track is never loaded). Source lives OUTSIDE the repo (not
    # committed): ~/.config/voice/music/old-time-appalachian.ogg - see
    # SKILL.md for how to fetch it. Ogg/Opus is read natively by the voice
    # server (libopusfile) - no WAV conversion needed. Set a specific gain
    # with volume:.
    background:
      volume: 0.24
      random_start: true
      sources:
        - file: "/home/user/.config/voice/music/old-time-appalachian.ogg"

  clean_narration:
    chain:
      - compressor:
          threshold: -18
          ratio: 2.2

  ambience_only:
    background:
      volume: 0.2
      sources:
        - file: "sfx/alert.wav"
        - file: "sfx/error.wav"

voices:
  # =============================================================================
  # AUDIO8 VOICES (compact multilingual zero-shot TTS, CPU + GPU backends)
  # =============================================================================
  # Two backends, one preset shape. CPU weights live OUTSIDE this repo at
  # /workspace/models/audio8-tts/ (fetch via scripts/setup-audio8.sh); GPU
  # checkpoint at /workspace/models/audio8-tts-pt/ (scripts/setup-audio8-gpu.sh).
  # Registered voice names are files under vendor/audio8-runtime/voices/
  # ("default" is the packaged reference voice; "Ruth" was cloned from
  # ~/Downloads/ruth2.wav - see SKILL.md). Pick backend per request:
  # default (or --cpu) = ONNX CPU, --gpu = PyTorch CUDA. The engine ignores
  # per-preset `speed` (no speed knob in either upstream CLI).

  audio8:
    engine: audio8
    voice: "default"
    speed: 1.0

  ruth:
    engine: audio8
    voice: "Ruth"
    speed: 1.0


  # ==========================================================================
  # QWEN VOICES (Qwen3-TTS - zero-shot voice cloning via llama.cpp llama-tts)
  # ==========================================================================
  # Qwen3-TTS-12Hz-1.7B-Base (Q4_K_M backbone + Q8_0 mmproj) from
  # ggml-org/Qwen3-TTS-12Hz-1.7B-Base-GGUF, ~1.5GB of weights at
  # /workspace/models/qwen3-tts/ (fetch via ./scripts/setup-qwen.sh).
  # Two backends sharing one preset: --cpu (default) = pure CPU
  # (`llama-tts -ngl 0`); --gpu = full CUDA offload (`-ngl 99`, needs an
  # NVIDIA GPU). The voice-clone source is the `speaker:` field (a WAV
  # path, absolute); the engine ignores per-preset `speed` (no speed knob
  # in the upstream CLI).

  ruthie:
    engine: qwen
    voice: "Ruth"
    speaker: "/workspace/models/qwen3-tts/ruth2.wav"
    # Sibling transcript of the speaker WAV (generated once with whisper -
    # see SKILL.md). Sent as `speaker_ref_text` so the sidecar clone has
    # text to anchor on.
    speaker_text: "/workspace/models/qwen3-tts/ruth2.txt"
    # Compute backend for the qwen engine (cpu = llama-tts -ngl 0,
    # gpu = -ngl 99 full CUDA offload). The single source of truth -
    # there are no CLI flags for this. Back on cpu: the box is out of
    # free VRAM right now, so -ngl 99 can't init (falls back loudly).
    backend: cpu
    effects: [appalachian_background]
    # Warm Southern-Texas text rewrite (see tmp/FUN_PLAN.md section 4): the
    # input is rephrased by the local LLM before it is spoken - meaning
    # preserved, gentle dialect added. Requires LM Studio on localhost:1234;
    # if it is unreachable the literal input is spoken (degraded, not fatal).
    personality_prompt: "You are Ruth, a warm, gentle Southern-Texas woman speaking to a friend on the porch. Rewrite the user's spoken phrase in a slow, soft drawl with natural Texas dialect (y'all, reckon, ain't, fixin', might could). Preserve the exact meaning and tone - do NOT add commentary or asides beyond a light Texas flavor. Reply with ONLY the rephrased sentence - no quotes, no labels, no explanations. Examples: I don't mind helping you wash the car if you want to come along -> Well now, I wouldn't mind helping you wash that car, if you reckon you'd like to come along. The rain started this morning, but I'm staying comfortable inside -> The rain started this mornin', but I'm staying put, thank you kindly. Don't you worry your little head about it - I'll handle it -> Don't you worry your little head about it, I'll handle it."

